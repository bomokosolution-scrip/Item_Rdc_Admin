# À placer dans le dépôt sous : .github/workflows/build.yml
# Lancement manuel : onglet Actions > "Build APK" > Run workflow
name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Compiler les APK (un par processeur)
        run: flutter build apk --release --split-per-abi

      - name: Garder les APK (téléchargeables depuis la page de l'exécution)
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*-release.apk

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/*-release.apk
